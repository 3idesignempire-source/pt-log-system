<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Log System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, sans-serif; }
        .card-custom { border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); border: 1px solid #1e293b; background-color: #1e293b !important; color: #f8fafc; }
        .app-screen { display: none; } 
        .active-screen { display: block; } 

        /* Fixed Header Layout */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .header-title-section { flex: 1; padding-right: 8px; }
        .header-title-section h6 { color: #f8fafc !important; }
        .header-btn-group { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .btn-header-action { font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 8px; white-space: nowrap; }

        /* Mouse Click Fix Button Layout */
        .btn-stacked-action {
            width: 100%;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            font-weight: 700;
            font-size: 16px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: none;
            color: white;
            text-align: center;
            cursor: pointer;
        }
        .btn-stacked-action:hover { opacity: 0.95; }

        /* 3D Glass Box Icons */
        .icon-3d-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px; 
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.2), inset 0 -3px 6px rgba(0,0,0,0.3), 0 6px 12px rgba(0,0,0,0.4);
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            pointer-events: none;
        }

        .icon-3d-text {
            font-size: 30px;
            filter: drop-shadow(0px 5px 8px rgba(0,0,0,0.5)) saturate(1.4); 
            pointer-events: none;
        }

        .btn-label-centered { letter-spacing: 0.3px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); pointer-events: none; }
        
        /* Logsheet Sections Styling */
        .section-header-orange { background: linear-gradient(135deg, #f97316, #ea580c); color: white; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; }
        .section-header-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; }
        .section-header-green { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; }
        
        .log-row-container { background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
        .log-row { margin-bottom: 6px; }
        .btn-del-custom { background-color: #ef4444; color: white; border: none; font-weight: 500; }
        
        .accordion-button-custom {
            background-color: #1e293b; color: #f8fafc; font-weight: 600; border-radius: 10px !important; border: 1px solid #334155;
        }
        .accordion-button-custom:not(.collapsed) { background-color: #0f172a; color: #38bdf8; border-bottom: 1px dashed #475569; box-shadow: none; }
        
        .workout-badge { font-size: 11px; padding: 3px 6px; border-radius: 6px; font-weight: 600; display: inline-block; margin-top: 4px; margin-bottom: 2px; }
        .badge-warmup { background-color: #431407; color: #fdba74; }
